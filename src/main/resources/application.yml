server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: backend-iot
  

  datasource:
    url: jdbc:postgresql://localhost:5432/iot
    driver-class-name: org.postgresql.Driver
    username: iot
    password: iot

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false


  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

# Application Custom Properties
app:
  api:
    prefix: /api/v1
  jwt:
    # 256-bit base64 / plain secret key for HMAC-SHA256
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 1 day in milliseconds
    refresh-expiration-ms: 604800000 # 7 days in milliseconds
    issuer: base-spring-api
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "http://localhost:4200"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "OPTIONS"
    allowed-headers: "*"
    allow-credentials: true

# Springdoc OpenAPI / Swagger UI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.app: DEBUG
    org.springframework.security: INFO

mqtt:
  broker-url: tcp://localhost:1883
  client: Backend_Server
  username: ""
  password: ""
  keep-alive: 60
  connection-timeout: 10
  clean-session: true
  qos: 1
  topics:
    sensor-data: sensor/data
    device-control: device/control/
    device-ack: device/ack/+
    device-comfirm: device/confirm/
    device-status: device/status

